[project]
name = "robot-ai"
version = "0.1.0"
description = "Wall-climbing robot research and development project"
readme = "README.md"
authors = [
    { name = "ponsan" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "pydantic",
    "python-dotenv",
    "pyserial",
    "requests",
    "rich",
    "loguru",
]

[project.optional-dependencies]

ml = [
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "torch",
    "torchvision",
    "opencv-python",
    "pillow",
    "tqdm",
]

gui = [
    "streamlit",
    "plotly",
]

data = [
    "openpyxl",
    "pyarrow",
    "h5py",
]

robot = [
    "pyserial",
    "python-can",
    "transitions",
]

[dependency-groups]

dev = [
    "pytest>=8,<9",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

markers = [
    "ml: tests requiring machine learning libraries",
    "gpu: tests requiring a CUDA-capable GPU",
    "ros: tests requiring a ROS 2 environment",
    "slow: tests that take relatively long to run",
]
